[workspace]
members = [
    "crates/iku_capsule",
    "crates/iku_semantics",
    "crates/iku_structured_fields",
    "crates/iku_uri",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
iku_semantics = { path = "crates/iku_semantics" }
iku_structured_fields = { path = "crates/iku_structured_fields" }
iku_uri = { path = "crates/iku_uri" }
bytes = { version = "1.12.1", default-features = false }
snafu = { version = "0.9.2", git = "https://github.com/opengensokyonet/snafu", rev = "03cb8d2e52a3b0b33a39cc3d4ce8a7075fa4ab58", default-features = false, features = ["rust_1_81"] }
nitori_call = { git = "https://github.com/opengensokyonet/nitori", rev = "0de5f36b921c891815d138226c6180c6aa70953b", default-features = false }
nitori_codec = { git = "https://github.com/opengensokyonet/nitori", rev = "0de5f36b921c891815d138226c6180c6aa70953b", default-features = false }
sakuya_var_int = { git = "https://github.com/opengensokyonet/sakuya", rev = "39c4bc0fad1f032be7d00cc6f5b5c14585b19eb9" }
nitori_io = { git = "https://github.com/opengensokyonet/nitori", rev = "0de5f36b921c891815d138226c6180c6aa70953b", default-features = false }
